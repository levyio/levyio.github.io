<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coming soon</title>
<style>
  :root {
    color-scheme: light;
    --field: #e9e6df;      /* the plate's warm white */
    --ink: #16141a;        /* charcoal */
    --dim: #6d6a63;        /* quiet text on the field */
    --violet: #6d549c;     /* the one colour, deep enough for white */
    --hairline: #c9c5bc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--field);
    color: var(--ink);
    font-family: "Helvetica Neue", "Helvetica", "Arial", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.2rem;
    padding: 2rem;
    overflow: hidden;
  }
  #plate {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }
  h1, p, form { position: relative; z-index: 1; }
  h1 {
    font-family: "Didot", "Bodoni 72", "Georgia", serif;
    font-weight: 400;
    font-size: clamp(1.7rem, 5vw, 2.8rem);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    text-align: center;
  }
  p, input, button {
    font-family: ui-monospace, "SF Mono", "Menlo", monospace;
  }
  p {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: center;
  }
  form { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
  input[type="email"] {
    background: rgba(233, 230, 223, 0.75);
    border: 1px solid var(--hairline);
    color: var(--ink);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 0.8rem 1rem;
    width: min(300px, 62vw);
    outline: none;
  }
  input[type="email"]:focus { border-color: var(--violet); }
  input[type="email"]::placeholder { color: var(--dim); }
  button {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: rgba(233, 230, 223, 0.75);
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 0.8rem 1.4rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  button:hover { border-color: var(--violet); color: var(--violet); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  .fineprint { font-size: 0.62rem; letter-spacing: 0.12em; }
  .ok { color: var(--violet); }
</style>
</head>
<body>
<canvas id="plate" aria-hidden="true"></canvas>

<h1>Coming&nbsp;soon</h1>
<p>Something is being built here</p>

<form id="sub" novalidate>
  <input type="email" id="em" required placeholder="your@email" aria-label="Email address" autocomplete="email" />
  <button type="submit">Notify me</button>
</form>
<p class="fineprint" id="note"></p>

<script>
/* ---------- the whole screen is the plate ----------
   Black grains on a white field, everywhere. The frequency keeps
   changing: each phase the grains shake loose, wander, and settle
   into the next figure. A loop with no end. */
(function () {
  var c = document.getElementById("plate"), x = c.getContext("2d");
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dpr = Math.min(devicePixelRatio || 1, 1.75);
  var W = 0, H = 0;
  function resize() {
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.fillStyle = "#e9e6df"; x.fillRect(0, 0, W, H);
  }
  addEventListener("resize", resize); resize();

  var N = Math.min(5200, Math.max(2600, Math.floor(W * H / 380)));
  var px = new Float32Array(N), py = new Float32Array(N);
  var vx = new Float32Array(N), vy = new Float32Array(N);
  for (var i = 0; i < N; i++) { px[i] = Math.random(); py[i] = Math.random(); }

  /* the phase sequence: figures the screen moves between, forever */
  var MODES = [[3, 2], [5, 4], [4, 1], [7, 5], [2, 3], [6, 4], [5, 2], [8, 5]];
  var PHASE_S = 16;                // seconds per figure
  var FADE_S = 2.5;                // seconds of morph between figures

  function fieldAt(mx, nx, u, v) {
    return Math.sin(mx * Math.PI * u) * Math.sin(nx * Math.PI * v)
         + Math.sin(nx * Math.PI * u) * Math.sin(mx * Math.PI * v);
  }

  function draw(tms) {
    if (!(W > 0)) { resize(); return; }
    var t = tms * 0.001;
    var k = Math.floor(t / PHASE_S);
    var a = MODES[k % MODES.length], b = MODES[(k + 1) % MODES.length];
    var into = t - k * PHASE_S;
    var f = into > PHASE_S - FADE_S ? (into - (PHASE_S - FADE_S)) / FADE_S : 0;
    f = f * f * (3 - 2 * f); // ease
    // the breath: agitation swells as the figure changes, then true calm —
    // calm is what lets the still lines catch the grains
    var breath = 0.12 + 0.88 * Math.max(f, Math.pow(Math.max(0, 1 - into / FADE_S), 2));

    // charcoal on paper: in storms the marks linger (each grain draws its
    // stroke); in calm the paper reabsorbs the strokes back into the grains
    var breathNorm = (breath - 0.12) / 0.88;
    var fade = 0.16 - 0.14 * breathNorm;
    x.fillStyle = "rgba(233,230,223," + fade.toFixed(3) + ")";
    x.fillRect(0, 0, W, H);
    x.fillStyle = "rgba(22,20,26,0.95)";
    var PI = Math.PI;
    var am = a[0] * PI, an = a[1] * PI, bm = b[0] * PI, bn = b[1] * PI;
    for (var i = 0; i < N; i++) {
      var u = px[i], v = py[i];
      // blended field + gradient — the grains drain toward the still lines
      var sau = Math.sin(am * u), cau = Math.cos(am * u), sav = Math.sin(an * v), cav = Math.cos(an * v);
      var sbu = Math.sin(an * u), cbu = Math.cos(an * u), sbv = Math.sin(am * v), cbv = Math.cos(am * v);
      var A1 = sau * sav + sbu * sbv;
      var dx1 = am * cau * sav + an * cbu * sbv;
      var dy1 = an * sau * cav + am * sbu * cbv;
      var scu = Math.sin(bm * u), ccu = Math.cos(bm * u), scv = Math.sin(bn * v), ccv = Math.cos(bn * v);
      var sdu = Math.sin(bn * u), cdu = Math.cos(bn * u), sdv = Math.sin(bm * v), cdv = Math.cos(bm * v);
      var A2 = scu * scv + sdu * sdv;
      var dx2 = bm * ccu * scv + bn * cdu * sdv;
      var dy2 = bn * scu * ccv + bm * sdu * cdv;
      var A = (1 - f) * A1 + f * A2;
      var dAdx = (1 - f) * dx1 + f * dx2;
      var dAdy = (1 - f) * dy1 + f * dy2;
      var aAbs = Math.abs(A);
      vx[i] = vx[i] * 0.88 - A * dAdx * 0.00028 + (Math.random() - 0.5) * 0.0014 * (0.18 + breath) * aAbs;
      vy[i] = vy[i] * 0.88 - A * dAdy * 0.00028 + (Math.random() - 0.5) * 0.0014 * (0.18 + breath) * aAbs;
      px[i] = u + vx[i];
      py[i] = v + vy[i];
      if (px[i] < 0) px[i] += 1; else if (px[i] > 1) px[i] -= 1;
      if (py[i] < 0) py[i] += 1; else if (py[i] > 1) py[i] -= 1;
      x.fillRect(px[i] * W, py[i] * H, 1.7, 1.7);
    }
  }

  if (reduced) {
    for (var s = 0; s < 500; s++) draw(4000);
    return;
  }
  (function loop(tm) { draw(tm || 0); requestAnimationFrame(loop); })();
})();

/* ---------- subscribe: typed on the page, recorded quietly ---------- */
(function () {
  var SUPA_URL = "https://esyxrdprhseeodswpaqk.supabase.co";
  var SUPA_KEY = "sb_publishable_BpCu0uPWVI47Q_AOUgYVjA_7ZxVDgJ-";
  var form = document.getElementById("sub"), em = document.getElementById("em"), note = document.getElementById("note");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = (em.value || "").trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      note.textContent = "that doesn't look like an address — try again";
      return;
    }
    note.textContent = "…";
    fetch(SUPA_URL + "/rest/v1/subscribers", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY,
        "Prefer": "return=minimal",
      },
      body: JSON.stringify({ email: email }),
    }).then(function (r) {
      if (r.ok || r.status === 409) {
        form.remove();
        note.textContent = "you're on the list — one email when it opens";
        note.classList.add("ok");
      } else {
        note.textContent = "couldn't save — try again in a minute";
      }
    }).catch(function () {
      note.textContent = "couldn't save — try again in a minute";
    });
  });
})();
</script>
</body>
</html>
